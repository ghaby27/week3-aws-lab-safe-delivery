AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Network layer for the Onward Logistics order system (safe delivery lab): a VPC
  across two Availability Zones. Public subnets hold only the load balancer.
  Private subnets hold the containers and have NO route to the internet (no NAT,
  no default route): the containers reach AWS services through VPC endpoints, so
  that traffic stays on AWS's network.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, test, prod]
    Default: dev
  VpcCidr:
    Type: String
    Default: 10.30.0.0/16

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true   # needed for private DNS on the interface endpoints
      Tags: [{ Key: Name, Value: !Sub "onward-${Environment}-delivery-vpc" }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: !Sub "onward-${Environment}-delivery-igw" }]

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # ---------------------------------------------------------------------------
  # Public subnets: the load balancer only
  # ---------------------------------------------------------------------------
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: 10.30.0.0/24
      Tags: [{ Key: Name, Value: !Sub "onward-${Environment}-delivery-public-a" }]

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: 10.30.1.0/24
      Tags: [{ Key: Name, Value: !Sub "onward-${Environment}-delivery-public-b" }]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub "onward-${Environment}-delivery-public-rt" }]

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnetA, RouteTableId: !Ref PublicRouteTable }

  PublicSubnetBRouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnetB, RouteTableId: !Ref PublicRouteTable }

  # ---------------------------------------------------------------------------
  # Private subnets: the containers. Local routes + S3 gateway endpoint only.
  # ---------------------------------------------------------------------------
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: 10.30.10.0/24
      Tags: [{ Key: Name, Value: !Sub "onward-${Environment}-delivery-private-a" }]

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: 10.30.11.0/24
      Tags: [{ Key: Name, Value: !Sub "onward-${Environment}-delivery-private-b" }]

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub "onward-${Environment}-delivery-private-rt" }]

  PrivateSubnetARouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PrivateSubnetA, RouteTableId: !Ref PrivateRouteTable }

  PrivateSubnetBRouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PrivateSubnetB, RouteTableId: !Ref PrivateRouteTable }

  # ---------------------------------------------------------------------------
  # VPC endpoints (instead of a NAT gateway)
  # ---------------------------------------------------------------------------
  # HTTPS into the endpoint network interfaces, from the private subnets only.
  EndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "onward-${Environment}-delivery-endpoints-sg"
      GroupDescription: HTTPS from the private subnets to the interface endpoints
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 10.30.10.0/24, Description: private subnet a }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 10.30.11.0/24, Description: private subnet b }
      Tags: [{ Key: Name, Value: !Sub "onward-${Environment}-delivery-endpoints-sg" }]

  # Image pulls: the ECR API (auth, manifests) and the Docker registry endpoint.
  EcrApiEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ecr.api"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]

  EcrDockerEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ecr.dkr"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]

  # Container logs (awslogs driver).
  LogsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.logs"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]

  # ECR stores image layers in S3. Free gateway endpoint, limited to ECR's layer bucket.
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref PrivateRouteTable]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: EcrImageLayers
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "arn:${AWS::Partition}:s3:::prod-${AWS::Region}-starport-layer-bucket/*"

Outputs:
  VpcId:
    Value: !Ref Vpc
    Export: { Name: !Sub "onward-${Environment}-delivery-vpc-id" }
  VpcCidr:
    Value: !Ref VpcCidr
    Export: { Name: !Sub "onward-${Environment}-delivery-vpc-cidr" }
  PublicSubnetIds:
    Value: !Join [",", [!Ref PublicSubnetA, !Ref PublicSubnetB]]
    Export: { Name: !Sub "onward-${Environment}-delivery-public-subnet-ids" }
  PrivateSubnetIds:
    Value: !Join [",", [!Ref PrivateSubnetA, !Ref PrivateSubnetB]]
    Export: { Name: !Sub "onward-${Environment}-delivery-private-subnet-ids" }
